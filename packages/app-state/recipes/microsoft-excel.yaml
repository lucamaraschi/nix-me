schema_version: 1
id: microsoft-excel
name: Microsoft Excel
bundle_id: com.microsoft.Excel
install:
  cask: microsoft-office
detect:
  app_path: /Applications/Microsoft Excel.app
sandboxed: true
requires: []
config:
  - kind: defaults
    domain: com.microsoft.Excel
    keys:
      kOUIRibbonDefaultCollapse: {type: bool, ui: "View > Ribbon", doc: "Observed in Microsoft Excel 16.83."}
    unknown_keys: reject
    confirm: none
  - kind: manual
    step: Review editing, calculation, proofing, and remaining view preferences manually; only ribbon collapse is currently proven portable for Excel 16.83. Identity, licensing, add-ins, macros, documents, recent files, secure bookmarks, and cloud policy are excluded.
    confirm: full_manual
apply:
  poke: restart_app
  unsafe_to_kill: true
verified: null
