schema_version: 1
id: onepassword-cli
name: 1Password CLI
bundle_id: com.1password.cli
install:
  cask: 1password-cli
detect:
  command: command -v op >/dev/null 2>&1
sandboxed: false
requires: []
config:
  - kind: manual
    step: Authenticate the 1Password CLI through the desktop app; the harness reports ready only while an existing session can answer a capability-gated status check.
    doc: The ephemeral check is limited to reviewed op 2.x behavior, uses only the exit status of op whoami, and suppresses its output. It never signs in, and account identity, emails, vaults, session tokens, credentials, and device trust are never stored.
    marker:
      command: command -v op >/dev/null 2>&1 && op --version 2>/dev/null | grep -Eq '^2\.' && op whoami --help >/dev/null 2>&1 && op whoami --format=json >/dev/null 2>&1
    confirm: full_manual
apply:
  poke: none
  unsafe_to_kill: false
verified: null
