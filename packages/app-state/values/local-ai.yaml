local-ai:
  # Non-secret preferences only. Keep Pi auth and DS4 API keys outside values.
  pi_settings:
    defaultProvider: ds4
    defaultModel: dsv4-flash-q2
  ds4_settings:
    "$schema": https://raw.githubusercontent.com/mitsuhiko/pi-ds4/main/settings.schema.json
    protocol: openai-responses
    runtimeDir: /Users/batman/src/ai/ds4
    autoUpdate: false
    contextTokens: 32768
    power: 70
    readyTimeoutMs: 900000
