[workspace]
members = ["nix-me-apps", "codec"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "=1.0.104"
aes = "=0.9.3"
base64 = "=0.23.1"
cbc = { version = "=0.2.1", features = ["alloc", "block-padding"] }
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.10"
fs2 = "=0.4.3"
json5 = "=1.3.2"
jsonschema = { version = "=0.46.8", default-features = false }
getrandom = "=0.4.3"
plist = "=1.10.1"
quick-xml = "=0.42.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
serde_yaml = "=0.9.34"
sha2 = "=0.11.1"
shell-words = "=1.1.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.8"
zip = { version = "=9.0.4", default-features = false, features = ["deflate"] }
