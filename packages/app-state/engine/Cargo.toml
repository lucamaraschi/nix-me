[workspace]
members = ["nix-me-apps", "codec"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
aes = "=0.9.3"
base64 = "=0.23.1"
cbc = { version = "=0.2.1", features = ["alloc", "block-padding"] }
clap = { version = "=4.5.60", features = ["derive"] }
flate2 = "=1.1.10"
fs2 = "=0.4.3"
json5 = "=1.3.2"
jsonschema = { version = "=0.46.2", default-features = false }
getrandom = "=0.3.4"
plist = "=1.8.0"
quick-xml = "=0.38.4"
regex = "=1.12.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
serde_yaml = "=0.9.34"
sha2 = "=0.11.1"
shell-words = "=1.1.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=0.9.6"
zip = { version = "=7.0.0", default-features = false, features = ["deflate"] }
