[workspace]
members = ["nix-me-apps", "codec"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.95"
aes = "=0.8.4"
base64 = "=0.22.1"
cbc = { version = "=0.1.2", features = ["alloc", "block-padding"] }
clap = { version = "=4.5.23", features = ["derive"] }
flate2 = "=1.0.35"
fs2 = "=0.4.3"
json5 = "=0.4.1"
jsonschema = { version = "=0.17.1", default-features = false }
getrandom = "=0.2.15"
plist = "=1.7.0"
regex = "=1.11.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = { version = "=1.0.134", features = ["preserve_order"] }
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
shell-words = "=1.1.0"
tar = "=0.4.43"
tempfile = "=3.15.0"
thiserror = "=2.0.11"
toml = "=0.8.19"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
