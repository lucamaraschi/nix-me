name: Nix configuration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "apps/macos/**"
      - "nix/**"
      - "packages/app-state/engine/**"
      - "packages/management-api/**"
      - "tools/automation/**"
      - "tools/installation/**"
      - "Makefile"
      - ".github/workflows/nix-ci.yml"
      - ".github/workflows/update-flake-inputs.yml"
      - "docs/NIX_UPDATES.md"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "apps/macos/**"
      - "nix/**"
      - "packages/app-state/engine/**"
      - "packages/management-api/**"
      - "tools/automation/**"
      - "tools/installation/**"
      - "Makefile"
      - ".github/workflows/nix-ci.yml"
      - ".github/workflows/update-flake-inputs.yml"
      - "docs/NIX_UPDATES.md"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate every host configuration
        run: tools/automation/check-nix-host-matrix.sh
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Check profile boundaries and app installation
        run: |
          test "$(nix eval .#darwinConfigurations.vm-test.config.apps.state.enable)" = "true"
          test "$(nix eval .#darwinConfigurations.minimal-mac.config.apps.state.enable)" = "false"
          test "$(nix eval .#darwinConfigurations.bellerofonte.config.apps.manager.enable)" = "true"
          test "$(nix eval .#darwinConfigurations.nabucodonosor.config.apps.manager.enable)" = "true"
          casks="$(nix eval --json .#darwinConfigurations.bellerofonte.config.homebrew.casks | jq -r '.[].name')"
          grep -Fxq 'linear' <<<"$casks"
          if grep -Fxq -e openscad -e zenmap -e linear-linear <<<"$casks"; then
            echo 'Disabled or renamed casks remain in bellerofonte' >&2
            exit 1
          fi
          packages="$(nix eval --json .#darwinConfigurations.bellerofonte.config.nixMe.manifest.software.nixPackageDetails | jq -r '.[].name')"
          grep -Fxq 'openscad' <<<"$packages"
          grep -Fxq 'zenmap' <<<"$packages"
          managed_mas="$(nix eval --json .#darwinConfigurations.bellerofonte.config.apps.managedMasApps)"
          jq -e '.Xcode == 497799835 and .Tailscale == 1475387142' <<<"$managed_mas"
          test "$(nix eval --json .#darwinConfigurations.bellerofonte.config.homebrew.masApps)" = '{}'
          manifest_mas="$(nix eval --json .#darwinConfigurations.bellerofonte.config.nixMe.manifest.software.homebrew.masApps)"
          test "$manifest_mas" = "$managed_mas"
          nix eval --raw .#darwinConfigurations.nabucodonosor.config.system.activationScripts.postActivation.text \
            | grep -Fq '/Applications/Nix Me.app'
          nix eval --raw .#darwinConfigurations.nabucodonosor.config.system.activationScripts.postActivation.text \
            | grep -Fq '/usr/bin/ditto'
          activation="$(nix eval --raw .#darwinConfigurations.nabucodonosor.config.system.activationScripts.extraActivation.text)"
          grep -Fq '/bin/launchctl asuser "$user_uid"' <<<"$activation"
          grep -Fq 'HOME=/Users/batman' <<<"$activation"
          grep -Fq 'USER=batman' <<<"$activation"
          grep -Fq 'LOGNAME=batman' <<<"$activation"
          if grep -Fq 'sudo -u batman defaults write' <<<"$activation"; then
            echo 'Raycast preferences must run with the explicit user environment' >&2
            exit 1
          fi
      - name: Build managed packages
        run: nix build .#nix-me-apps .#nix-me-tui .#nix-me-macos --no-link
