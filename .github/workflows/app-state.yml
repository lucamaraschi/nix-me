name: App state engine

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      base_vm:
        description: Clean UTM macOS base VM name
        required: true
        default: macOS Tahoe - base
      vm_user:
        description: Passwordless-sudo account in the base VM
        required: true
  pull_request:
    paths:
      - "packages/app-state/engine/**"
      - "packages/app-state/recipes/**"
      - "packages/app-state/evidence/**"
      - "packages/app-state/catalog/**"
      - "tools/app-state/**"
      - "tools/update-homebrew-app-catalog.sh"
      - "packages/app-state/values/**"
      - "packages/app-state/metrics/**"
      - "packages/app-state/metrics/recipe-candidates.json"
      - "packages/app-state/metrics/recipe-candidates.schema.json"
      - "tests/vm/vm-test.sh"
      - "docs/APP_STATE.md"
      - "docs/CAPTURE.md"
      - "docs/REGISTRY.md"
      - "docs/HARNESS_PLAN.md"
      - "nix/modules/darwin/apps/nix-me.nix"
      - "nix/modules/home-manager/rectangle.nix"
      - ".github/workflows/app-state.yml"
  push:
    branches: [main]
    paths:
      - "packages/app-state/engine/**"
      - "packages/app-state/recipes/**"
      - "packages/app-state/evidence/**"
      - "packages/app-state/catalog/**"
      - "tools/app-state/**"
      - "tools/update-homebrew-app-catalog.sh"
      - "packages/app-state/values/**"
      - "packages/app-state/metrics/**"
      - "packages/app-state/metrics/recipe-candidates.json"
      - "packages/app-state/metrics/recipe-candidates.schema.json"
      - "tests/vm/vm-test.sh"
      - "nix/modules/darwin/apps/nix-me.nix"
      - "nix/modules/home-manager/rectangle.nix"
      - ".github/workflows/app-state.yml"

permissions:
  contents: read

jobs:
  registry:
    name: Local recipe catalog and metric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate T3 evidence contract and verification stamps
        run: packages/app-state/evidence/tests/run.sh
      - name: Validate recipe candidate scoring and freshness
        run: |
          python3 -m unittest discover -s tools/app-state -p 'test_*.py'
          python3 tools/app-state/score_recipe_candidates.py --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate every recipe
        working-directory: packages/app-state/engine
        run: cargo run -p nix-me-apps -- registry validate --recipe ../recipes --json
      - name: Validate top-200 application behavior map
        working-directory: packages/app-state/engine
        run: |
          cargo run -p nix-me-apps -- registry catalog-validate \
            --catalog ../catalog/homebrew-top-200-apps.json \
            --recipe ../recipes --json
      - name: Build top-200 metric artifact
        working-directory: packages/app-state/engine
        run: |
          cargo run -p nix-me-apps -- registry catalog-metric \
            --catalog ../catalog/homebrew-top-200-apps.json \
            --recipe ../recipes --json \
            > ../metrics/zero-click.json
          git diff --exit-code -- ../metrics/zero-click.json
      - name: Check weekly Homebrew snapshot freshness
        if: github.event_name == 'schedule'
        run: tools/update-homebrew-app-catalog.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: local-app-state-catalog
          path: |
            packages/app-state/catalog/homebrew-top-200-apps.json
            packages/app-state/catalog/homebrew-top-200-apps.md
            packages/app-state/metrics/zero-click.json

  headless:
    name: T0/T1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/app-state/engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  macos-real:
    name: T2 scratch-domain parity
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/app-state/engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p nix-me-apps --test macos_real -- --ignored --nocapture

  vm-app-state:
    name: UTM apply and idempotence
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, utm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Verify Rectangle in an ephemeral VM
        env:
          APP_STATE_BASE_VM: ${{ inputs.base_vm }}
          APP_STATE_VM_USER: ${{ inputs.vm_user }}
        run: |
          ./tests/vm/vm-test.sh \
            --base-vm="$APP_STATE_BASE_VM" \
            --vm-user="$APP_STATE_VM_USER" \
            --source=local \
            --onsuccess=delete \
            --onfailure=keep \
            --app-state-recipe=packages/app-state/recipes/rectangle.yaml \
            --app-state-values=packages/app-state/values/rectangle.yaml \
            --app-state-only=rectangle
