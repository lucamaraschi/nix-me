name: CLI and management API

on:
  pull_request:
    paths:
      - "apps/cli/**"
      - "packages/management-api/**"
      - "tests/integration/**"
      - "Makefile"
      - ".github/workflows/cli-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "packages/management-api/**"
      - "tests/integration/**"
      - "Makefile"
      - ".github/workflows/cli-ci.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install contract dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate CLI and management contracts
        run: make test-cli
