name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, such as v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for variable in \
            CERTIFICATE_P12_BASE64 \
            CERTIFICATE_PASSWORD \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_BASE64 \
            SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required secret: $variable" >&2
              exit 64
            fi
          done

      - name: Import Developer ID certificate
        id: signing
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/nix-me-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode >"$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "The certificate does not contain a Developer ID Application identity" >&2
            exit 65
          fi
          echo "identity=$identity" >>"$GITHUB_OUTPUT"
          echo "keychain=$keychain" >>"$GITHUB_OUTPUT"

      - name: Test
        run: swift test --package-path macos/NixMeApp

      - name: Build signed universal app
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
          BUILD_NUMBER: ${{ github.run_number }}
          NIX_ME_ARCHS: arm64 x86_64
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="${APP_VERSION#v}" ./scripts/build-macos-app.sh
          file "build/Nix Me.app/Contents/MacOS/NixMeApp" | grep -q 'arm64.*x86_64\|x86_64.*arm64'

      - name: Package signed DMG
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="${APP_VERSION#v}" ./scripts/package-macos-app.sh

      - name: Notarize and staple
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ./scripts/notarize-macos-app.sh "dist/Nix-Me-$version.dmg"

      - name: Generate signed appcast and cask
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ./scripts/generate-appcast.sh "$version" "dist/Nix-Me-$version.dmg" dist
          ./scripts/generate-homebrew-cask.sh "$version" "dist/Nix-Me-$version.dmg" dist/nix-me.rb
          shasum -a 256 "dist/Nix-Me-$version.dmg" >"dist/Nix-Me-$version.dmg.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifacts=(
            "dist/Nix-Me-$version.dmg"
            "dist/Nix-Me-$version.dmg.sha256"
            "dist/appcast.xml"
            "dist/nix-me.rb"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published and will not be overwritten" >&2
              exit 73
            fi
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" \
              --verify-tag \
              --generate-notes \
              --draft \
              --title "Nix Me $version"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Update Homebrew tap
        if: ${{ env.TAP_GITHUB_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/lucamaraschi/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          cp dist/nix-me.rb "$tap/Casks/nix-me.rb"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add Casks/nix-me.rb
          if ! git -C "$tap" diff --cached --quiet; then
            git -C "$tap" commit -m "Update Nix Me to ${RELEASE_TAG#v}"
            git -C "$tap" push
          fi

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
