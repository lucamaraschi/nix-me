name: Post-install TUI

on:
  pull_request:
    paths:
      - "apps/post-install-tui/**"
      - "nix/packages/nodejs-current-bin.nix"
      - "nix/packages/post-install-tui.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/tui-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/post-install-tui/**"
      - "nix/packages/nodejs-current-bin.nix"
      - "nix/packages/post-install-tui.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/tui-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: apps/post-install-tui/package-lock.json
      - working-directory: apps/post-install-tui
        run: npm ci
      - working-directory: apps/post-install-tui
        run: npm run build
      - working-directory: apps/post-install-tui
        run: node dist/index.js --version
      - working-directory: apps/post-install-tui
        run: npm audit --omit=dev
      - uses: cachix/install-nix-action@v31
      - name: Build Nix package
        run: nix build .#nix-me-tui --no-link
