name: Beta report
description: Report a problem found while testing an invited nix-me beta.
title: "[Beta]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing nix-me. Remove credentials, tokens, private repository URLs, and other sensitive data before submitting.
  - type: input
    id: revision
    attributes:
      label: Beta revision
      description: Paste the full output of `git rev-parse HEAD`.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation path
      options:
        - Fresh installation
        - Existing nix-me installation
        - Native app only
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: macOS version and architecture from `sw_vers` and `uname -m`.
      placeholder: macOS 15.x, arm64
    validations:
      required: true
  - type: checkboxes
    id: components
    attributes:
      label: Affected components
      options:
        - label: Installer or update
        - label: Nix build or activation
        - label: Application-state harness
        - label: Terminal UI
        - label: Native macOS app
        - label: Project synchronization
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include relevant output from `nix-me doctor`, `nix-me harness status`, and `git status --short`.
      render: shell
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Include the failing command, exit status, and relevant error text.
      render: shell
  - type: dropdown
    id: rollback
    attributes:
      label: Rollback result
      options:
        - Not attempted
        - Succeeded
        - Failed
        - Not applicable
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I removed credentials, tokens, private repository URLs, and other sensitive data.
          required: true
        - label: I included the exact beta revision and enough steps to reproduce the issue.
          required: true
