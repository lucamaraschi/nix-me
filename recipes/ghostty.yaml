schema_version: 1
id: ghostty
name: Ghostty
bundle_id: com.mitchellh.ghostty
install:
  cask: ghostty
detect:
  app_path: /Applications/Ghostty.app
config:
  - kind: file
    binds: config
    path: ~/.config/ghostty/config
    format: text
    merge: replace
    mode: "0644"
    confirm: none
apply:
  poke: restart_app
  unsafe_to_kill: true
verified: null
